name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-22.x-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.x-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx tsc

      - name: Package dist
        run: tar -czf aamf-dist.tar.gz dist

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v9
        with:
          script: |
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref_name,
              name: context.ref_name,
              generate_release_notes: true,
            });
            return release.data.upload_url;
          result-encoding: string

      - name: Upload release asset
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.ref_name,
              })).data.id,
              name: 'aamf-dist.tar.gz',
              data: fs.readFileSync('aamf-dist.tar.gz'),
            });
