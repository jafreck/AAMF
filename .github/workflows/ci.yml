name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            runtime/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('runtime/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        working-directory: runtime
        run: npm ci

      - name: Type check
        working-directory: runtime
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: runtime
        run: npx vitest run --coverage

  # Compatibility shim: branch protection on main still requires a
  # "Node.js 20.x" check.  This no-op job satisfies the gate until
  # the required-checks list is updated.  Remove once branch protection
  # is reconfigured to only require "Node.js 22.x".
  compat:
    name: Node.js 20.x
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lore requires Node >=22 — this job is a branch-protection shim. Remove after updating required checks."
